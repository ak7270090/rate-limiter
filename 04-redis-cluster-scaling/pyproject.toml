[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redis-cluster-scaling"
version = "0.1.0"
description = "Phase 4: the Redis limiter on Redis Cluster and Sentinel, with hot-key splitting and token leasing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "redis>=5.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "anyio>=4.4",
    "httpx>=0.27",
    "hypothesis>=6.112",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.package-data]
ratelab = ["lua/*.lua"]

[tool.ruff]
extend = "../ruff.toml"
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --cov=ratelab --cov-report=term-missing --cov-fail-under=80"
markers = ["redis: needs a Redis server at RATELAB_TEST_REDIS_URL"]

[tool.coverage.run]
omit = ["*/__main__.py"]

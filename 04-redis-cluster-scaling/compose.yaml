name: ratelab-phase4

# Base setup: one Redis. Add compose.cluster.yaml or compose.sentinel.yaml for the other modes.
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      RATELAB_REDIS_MODE: single
      RATELAB_REDIS_URL: redis://redis:6379/0
      RATELAB_LOG_LEVEL: ${RATELAB_LOG_LEVEL:-warning}
      RATELAB_REPLICA_COUNT_FOR_LOCAL_FALLBACK: ${API_REPLICAS:-3}
      RATELAB_REDIS_TIMEOUT_SECONDS: ${RATELAB_REDIS_TIMEOUT_SECONDS:-0.05}
      RATELAB_POLICY_OVERRIDES:
    deploy:
      replicas: ${API_REPLICAS:-3}
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

  # Script throughput straight against Redis, e.g.
  # docker compose run --rm memtier -s redis --command="EVALSHA <sha> 1 __key__ 100 10 1 100"
  #   --command-key-pattern=R --key-prefix=bench:key --key-maximum=100000
  memtier:
    image: redislabs/memtier_benchmark:2.1.1
    profiles: ["bench"]
    command: ["-t", "4", "-c", "25", "--pipeline", "32", "--test-time", "10", "--hide-histogram"]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

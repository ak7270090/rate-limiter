name: ratelab-phase2

services:
  api:
    build: .
    environment:
      RATELAB_POLICIES_FILE: ${RATELAB_POLICIES_FILE:-policies.yaml}
      RATELAB_LOG_LEVEL: ${RATELAB_LOG_LEVEL:-warning}
    deploy:
      replicas: ${API_REPLICAS:-1}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

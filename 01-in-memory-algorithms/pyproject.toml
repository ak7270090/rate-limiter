[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "in-memory-algorithms"
version = "0.1.0"
description = "Phase 1: six rate limiting algorithms behind one interface, in memory"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "anyio>=4.4",
    "hypothesis>=6.112",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
extend = "../ruff.toml"
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --cov=ratelab --cov-report=term-missing --cov-fail-under=80"

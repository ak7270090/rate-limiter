name: ratelab-phase5

# front (published ports) -> edge (Envoy x2 or nginx x2) -> API x3 -> Redis
#   :8080 Envoy global limit, fail open      :8083 Envoy global limit, fail closed
#   :8084 Envoy local token bucket            :8081 nginx limit_req      :8082 API directly
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      RATELAB_REDIS_URL: redis://redis:6379/0
      RATELAB_LOG_LEVEL: ${RATELAB_LOG_LEVEL:-warning}
      RATELAB_POLICY_OVERRIDES:
    deploy:
      replicas: ${API_REPLICAS:-3}
    depends_on:
      redis:
        condition: service_healthy

  ratelimit:
    image: envoyproxy/ratelimit:63c7e9cc
    command: ["/bin/ratelimit"]
    environment:
      USE_STATSD: "false"
      LOG_LEVEL: warn
      REDIS_SOCKET_TYPE: tcp
      REDIS_URL: redis:6379
      RUNTIME_ROOT: /data
      RUNTIME_SUBDIRECTORY: ratelimit
      RUNTIME_WATCH_ROOT: "false"
      GRPC_PORT: "8081"
    volumes:
      - ./infra/ratelimit-config.yaml:/data/ratelimit/config/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  envoy:
    image: envoyproxy/envoy:v1.32.13
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - ./infra/envoy.yaml:/etc/envoy/envoy.yaml:ro
    deploy:
      replicas: ${ENVOY_REPLICAS:-2}
    depends_on:
      api:
        condition: service_healthy
      ratelimit:
        condition: service_started

  edge-nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/edge-nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      replicas: ${EDGE_NGINX_REPLICAS:-2}
    depends_on:
      api:
        condition: service_healthy

  front:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
    volumes:
      - ./infra/front-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      envoy:
        condition: service_started
      edge-nginx:
        condition: service_started

# The entry point: one port per path into the stack, no limiting here. Each upstream name
# resolves to every replica when nginx starts; requests rotate round robin.
events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream envoy_global { server envoy:10000; keepalive 64; }
    upstream envoy_global_deny { server envoy:10001; keepalive 64; }
    upstream envoy_local { server envoy:10002; keepalive 64; }
    upstream edge_nginx { server edge-nginx:80; keepalive 64; }
    upstream api { server api:8000; keepalive 64; }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    server { listen 8080; location / { proxy_pass http://envoy_global; } }
    server { listen 8083; location / { proxy_pass http://envoy_global_deny; } }
    server { listen 8084; location / { proxy_pass http://envoy_local; } }
    server { listen 8081; location / { proxy_pass http://edge_nginx; } }
    server { listen 8082; location / { proxy_pass http://api; } }
}

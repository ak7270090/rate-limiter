# nginx limit_req: a leaky bucket per key, counted in this nginx's shared memory only.
# /items: 10 requests/s per API key with a burst of 100 (about 100 per 10 s).
# /search: 30 requests/s for everyone with a burst of 300 (about 300 per 10 s).
events {
    worker_connections 4096;
}

http {
    access_log off;

    limit_req_zone $http_x_api_key zone=items_per_key:10m rate=10r/s;
    # A constant key: nginx does not count requests whose key is empty ($server_name was).
    limit_req_zone "all" zone=search_global:1m rate=30r/s;
    limit_req_status 429;

    upstream api { server api:8000; keepalive 64; }

    server {
        listen 80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location = /items {
            limit_req zone=items_per_key burst=100 nodelay;
            proxy_pass http://api;
        }
        location = /search {
            limit_req zone=search_global burst=300 nodelay;
            proxy_pass http://api;
        }
        location / {
            proxy_pass http://api;
        }
    }
}

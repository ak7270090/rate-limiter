events {
    worker_connections 4096;
}

http {
    access_log off;

    # "api" resolves to every replica's IP when nginx starts; requests rotate round robin.
    upstream api {
        server api:8000;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

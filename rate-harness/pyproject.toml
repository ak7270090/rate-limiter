[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rate-harness"
version = "0.1.0"
description = "Phase 0: one test and load harness for every rate limiting setup"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.4",
    "aiohttp>=3.10",
    "pydantic-settings>=2.5",
    "pytest>=8.3",
    "locust>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
extend = "../ruff.toml"
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-p no:cacheprovider"
markers = [
    "accuracy: steady traffic on one key stays within the per-key limit",
    "boundary_burst: a burst on each side of a window reset stays within the limit",
    "concurrency: many parallel requests on one key stay within the limit",
    "global_limit: a limit shared by all keys holds across replicas",
    "headers: RateLimit, RateLimit-Policy and Retry-After are present and consistent",
    "failover: the store going down follows each route's fail-open / fail-closed policy",
    "latency_overhead: limiting adds little latency over an unlimited route",
]
